name: Deploy

# Runs on demand from main only. Every job uses the "production" environment: in GitHub › Settings ›
# Environments, restrict it to the main branch and add required reviewers so each deploy needs approval.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, api, landing, app, database]
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Only main can deploy
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploys run from main only."
          exit 1

  database:
    needs: [guard]
    if: inputs.target == 'all' || inputs.target == 'database'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push

  api:
    needs: [guard, database]
    if: always() && needs.guard.result == 'success' && !failure() && !cancelled() && (inputs.target == 'all' || inputs.target == 'api')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test before deploying
        run: pnpm --filter @zephyr/api test
      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
        run: |
          for v in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!v}" || { echo "Set the $v variable"; exit 1; }
          done
          # Phase 6: the AI Gateway lives in the same Cloudflare account.
          pnpm exec wrangler deploy \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY" \
            --var "CF_ACCESS_TEAM_DOMAIN:$CF_ACCESS_TEAM_DOMAIN" \
            --var "CF_ACCESS_AUD:$CF_ACCESS_AUD" \
            --var "AI_GATEWAY_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"

  landing:
    needs: [guard, api]
    if: always() && needs.guard.result == 'success' && !failure() && !cancelled() && (inputs.target == 'all' || inputs.target == 'landing')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build gets only the public site key; the Cloudflare token is limited to the deploy step.
      - name: Build landing page and admin console
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          test -n "$PUBLIC_TURNSTILE_SITE_KEY" || { echo "Set the TURNSTILE_SITE_KEY variable"; exit 1; }
          pnpm turbo run build --filter=@zephyr/landing...
      - name: Deploy landing Worker
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  app:
    needs: [guard, api]
    if: always() && needs.guard.result == 'success' && !failure() && !cancelled() && (inputs.target == 'all' || inputs.target == 'app')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build gets only the public site key; the Cloudflare token is limited to the deploy step.
      - name: Build app
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: pnpm turbo run build --filter=@zephyr/web...
      - name: Deploy app Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
