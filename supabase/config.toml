# Supabase CLI config for local development. Production settings live in the Supabase dashboard;
# keep the auth hook below enabled there too (Authentication › Hooks › Before User Created).
project_id = "zephyr"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Public sign-up (POST /auth/v1/signup) is off. Accounts are created only by the API, which checks
# the invite token server-side and then uses the Auth admin API (invite / magic link), so nobody can
# pre-register an invited email with their own password. Mirror this in the dashboard:
# Authentication › Sign In / Providers › "Allow new users to sign up" = off.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
# Sign-in is by 6-digit code only (no clickable magic links), valid for 10 minutes.
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# The code email. Shows the code only; there is deliberately no sign-in button to click.
[auth.email.template.magic_link]
subject = "Your Zephyr sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

# Supabase's built-in sender is for testing only. Production sends through Resend's SMTP relay.
# Set RESEND_API_KEY in the environment (or the same values in Authentication › Emails › SMTP).
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "hello@zephyr.midnightpoetry.studio"
sender_name = "Zephyr"

# Passkeys (Supabase beta). One relying party for both Zephyr hosts; only these two origins may
# use it, so other *.midnightpoetry.studio apps can't. Changing rp_id invalidates every passkey.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Zephyr"
rp_id = "midnightpoetry.studio"
rp_origins = ["https://zephyrapp.midnightpoetry.studio", "https://zephyr.midnightpoetry.studio"]

# Defence in depth: even admin-created accounts must match an open invite while Invite only is on.
# Enforces Open / Invite only / paused on the server before any account is created.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"
